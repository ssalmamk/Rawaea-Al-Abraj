<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مؤسسة روائع الأبراج للتجارة | Rawaea Al-Abraj Trading Est.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #0e131d;
      --bg-darker: #080b12;
      --bg-card-dark: #161d2b;
      --bg-light: #faf8f5;
      --bg-white: #ffffff;
      --gold: #d97706;
      --gold-light: #f59e0b;
      --gold-soft: #fef3c7;
      --bronze: #92400e;
      --text-main: #111827;
      --text-muted: #4b5563;
      --border: #e5e7eb;
      --wa-green: #16a34a;
      --wa-green-hover: #15803d;
      --danger: #dc2626;
      --radius: 14px;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--bg-light);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
    }

    html[dir="ltr"] body {
      font-family: 'Inter', sans-serif;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input, select, textarea { font-family: inherit; }

    .container {
      width: 100%;
      max-width: 1260px;
      margin: 0 auto;
      padding: 0 18px;
    }

    /* Top Announcement Bar */
    .top-bar {
      background: linear-gradient(90deg, #b45309, #d97706, #b45309);
      color: #fff;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 8px 14px;
      text-align: center;
    }
    .top-bar a { text-decoration: underline; margin: 0 4px; }

    /* Header */
    header {
      background: var(--bg-dark);
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 40;
      border-bottom: 1px solid rgba(245, 158, 11, 0.25);
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }

    .nav-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-svg {
      width: 50px;
      height: 50px;
      flex-shrink: 0;
      filter: drop-shadow(0 3px 8px rgba(245, 158, 11, 0.35));
    }

    .brand-text h1 {
      font-size: 1.18rem;
      font-weight: 900;
      color: #fbbf24;
      line-height: 1.25;
    }

    .brand-text p {
      font-size: 0.78rem;
      color: #cbd5e1;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-lang {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.88rem;
      transition: 0.2s;
    }
    .btn-lang:hover { background: rgba(245, 158, 11, 0.2); border-color: #f59e0b; }

    .btn-cart {
      background: linear-gradient(135deg, #d97706, #f59e0b);
      color: #0e131d;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.92rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.35);
      transition: 0.2s;
    }
    .btn-cart:hover { transform: translateY(-1px); }

    .cart-badge {
      background: #0e131d;
      color: #fbbf24;
      min-width: 24px;
      height: 24px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 0 6px;
    }

    /* Hero */
    .hero {
      background: radial-gradient(circle at top right, #1f2937 0%, #0e131d 55%, #080b12 100%);
      color: #fff;
      padding: 48px 0 42px;
      position: relative;
      border-bottom: 3px solid var(--gold);
    }

    .hero-inner {
      text-align: center;
      max-width: 860px;
      margin: 0 auto;
    }

    .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: #fcd34d;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .hero h2 {
      font-size: clamp(1.7rem, 4vw, 2.7rem);
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 14px;
      background: linear-gradient(180deg, #ffffff 30%, #fcd34d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: #cbd5e1;
      font-size: 1.02rem;
      margin-bottom: 24px;
    }

    .search-box {
      position: relative;
      max-width: 680px;
      margin: 0 auto 22px;
    }

    .search-box input {
      width: 100%;
      padding: 15px 48px 15px 18px;
      border-radius: 14px;
      border: 2px solid rgba(245, 158, 11, 0.4);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: 0.2s;
    }
    html[dir="ltr"] .search-box input { padding: 15px 18px 15px 48px; }
    .search-box input::placeholder { color: #94a3b8; }
    .search-box input:focus { border-color: #f59e0b; background: rgba(255,255,255,0.13); }

    .search-icon {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      right: 16px;
      font-size: 1.15rem;
      color: #fbbf24;
      pointer-events: none;
    }
    html[dir="ltr"] .search-icon { right: auto; left: 16px; }

    .hero-badges {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.86rem;
      color: #e2e8f0;
    }
    .hero-badges span {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 6px 12px;
      border-radius: 10px;
    }

    /* Filters Section */
    .filters-section {
      padding: 26px 0 12px;
    }

    .filter-label {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--bronze);
      margin-bottom: 10px;
      display: block;
    }

    .pills-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .pill {
      padding: 8px 15px;
      border-radius: 999px;
      background: #fff;
      border: 1.5px solid var(--border);
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.88rem;
      transition: 0.2s;
    }
    .pill:hover { border-color: var(--gold); color: var(--gold); }
    .pill.active {
      background: var(--bg-dark);
      color: #fbbf24;
      border-color: var(--gold);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
    }

    .catalog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .results-count {
      font-weight: 800;
      font-size: 1rem;
      color: var(--text-main);
    }

    .clear-btn {
      color: var(--gold);
      font-weight: 700;
      font-size: 0.88rem;
      text-decoration: underline;
    }

    /* Product Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      padding-bottom: 42px;
    }

    .product-card {
      background: var(--bg-white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .product-card:hover {
      transform: translateY(-3px);
      border-color: var(--gold-light);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .brand-tag {
      background: #111827;
      color: #fbbf24;
      font-size: 0.76rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .cat-tag {
      background: var(--gold-soft);
      color: var(--bronze);
      font-size: 0.76rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .part-visual {
      background: linear-gradient(135deg, #f8fafc, #f1f5f9);
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 18px 12px;
      text-align: center;
      margin-bottom: 14px;
      cursor: pointer;
    }
    .part-visual .part-icon {
      font-size: 2.2rem;
      display: block;
      margin-bottom: 6px;
    }
    .part-visual .oem-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 1px solid #cbd5e1;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 800;
      color: #0f172a;
      direction: ltr;
    }

    .product-title {
      font-size: 1.04rem;
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--text-main);
      cursor: pointer;
    }

    .product-specs {
      font-size: 0.86rem;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: auto;
    }

    .btn-wa {
      background: var(--wa-green);
      color: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.88rem;
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s;
    }
    .btn-wa:hover { background: var(--wa-green-hover); }

    .card-sub-actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .btn-add {
      background: var(--bg-dark);
      color: #fbbf24;
      padding: 9px 12px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.86rem;
      transition: 0.2s;
    }
    .btn-add:hover { background: #1e293b; }

    .btn-copy {
      background: #f3f4f6;
      color: #374151;
      padding: 9px 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.82rem;
      border: 1px solid #d1d5db;
    }
    .btn-copy:hover { background: #e5e7eb; }

    /* Branches & Contact Section */
    .info-section {
      background: #fff;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 44px 0;
    }

    .section-title {
      text-align: center;
      font-size: 1.55rem;
      font-weight: 900;
      margin-bottom: 26px;
      color: var(--bg-dark);
    }

    .branches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 20px;
    }

    .info-card {
      background: var(--bg-light);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .info-card h3 {
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--bronze);
      margin-bottom: 10px;
    }

    .info-card p, .info-card li {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .info-card ul { list-style: none; }

    .phone-link {
      display: inline-block;
      font-weight: 800;
      color: var(--bg-dark);
      direction: ltr;
      margin-top: 4px;
    }
    .phone-link:hover { color: var(--gold); }

    /* Footer */
    footer {
      background: var(--bg-darker);
      color: #cbd5e1;
      padding: 32px 0 24px;
      text-align: center;
    }

    .footer-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .btn-admin {
      background: rgba(255,255,255,0.07);
      color: #94a3b8;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 700;
    }
    .btn-admin:hover { color: #fbbf24; border-color: #fbbf24; }

    /* Modals & Drawers - STRICTLY HIDDEN BY DEFAULT */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 11, 18, 0.72);
      z-index: 90;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(3px);
    }

    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 11, 18, 0.68);
      z-index: 80;
      display: none;
      justify-content: flex-end;
    }
    html[dir="rtl"] .drawer-overlay { justify-content: flex-start; }

    .drawer {
      background: #fff;
      width: 100%;
      max-width: 430px;
      height: 100%;
      display: flex;
      flex-direction: column;
      box-shadow: -8px 0 30px rgba(0,0,0,0.25);
    }

    .modal-box {
      background: #fff;
      width: 100%;
      max-width: 620px;
      max-height: 90vh;
      border-radius: 16px;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      background: var(--bg-dark);
      color: #fff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .modal-header h3 { font-size: 1.08rem; font-weight: 800; color: #fbbf24; }

    .close-btn {
      background: rgba(255,255,255,0.12);
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      font-size: 1.3rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .close-btn:hover { background: var(--danger); }

    .modal-body { padding: 20px; flex: 1; overflow-y: auto; }

    .cart-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .qty-controls {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f3f4f6;
      padding: 4px 8px;
      border-radius: 8px;
    }
    .qty-controls button {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: #fff;
      border: 1px solid #d1d5db;
      font-weight: 800;
    }

    .drawer-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: #f9fafb;
    }

    .price-note {
      background: var(--gold-soft);
      color: var(--bronze);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 800;
      margin-bottom: 12px;
      text-align: center;
    }

    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 0.88rem;
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--text-main);
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid #d1d5db;
      border-radius: 10px;
      font-size: 0.94rem;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--gold);
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #d97706, #f59e0b);
      color: #0e131d;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 900;
      font-size: 0.96rem;
      text-align: center;
      display: inline-block;
    }
    .btn-primary:hover { filter: brightness(1.05); }

    .admin-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .admin-tab {
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 800;
      background: #f3f4f6;
      color: #374151;
    }
    .admin-tab.active { background: var(--bg-dark); color: #fbbf24; }

    .code-box {
      background: #0f172a;
      color: #e2e8f0;
      padding: 12px;
      border-radius: 10px;
      font-family: monospace;
      font-size: 0.78rem;
      direction: ltr;
      text-align: left;
      overflow-x: auto;
      white-space: pre;
      margin: 10px 0;
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: #111827;
      color: #fbbf24;
      padding: 11px 20px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.9rem;
      z-index: 200;
      display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid rgba(251, 191, 36, 0.4);
    }

    @media (max-width: 640px) {
      .brand-text h1 { font-size: 1rem; }
      .hero { padding: 34px 0 28px; }
      .products-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Top Announcement Bar -->
  <div class="top-bar" id="topBar"></div>

  <!-- Header -->
  <header>
    <div class="container nav-wrap">
      <div class="brand">
        <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Z Logo">
          <defs>
            <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fde68a"/>
              <stop offset="50%" stop-color="#d97706"/>
              <stop offset="100%" stop-color="#78350f"/>
            </linearGradient>
            <linearGradient id="metalBg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1f2937"/>
              <stop offset="100%" stop-color="#090d16"/>
            </linearGradient>
            <linearGradient id="chromeZ" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="50%" stop-color="#cbd5e1"/>
              <stop offset="100%" stop-color="#f59e0b"/>
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="46" fill="url(#metalBg)" stroke="url(#goldRing)" stroke-width="6"/>
          <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(251,191,36,0.35)" stroke-width="1.5"/>
          <path d="M29 31 H71 V41 L43 61 H71 V71 H29 V61 L57 41 H29 Z" fill="url(#chromeZ)"/>
        </svg>
        <div class="brand-text">
          <h1 id="brandTitle"></h1>
          <p id="brandSubtitle"></p>
        </div>
      </div>

      <div class="nav-actions">
        <button class="btn-lang" id="langToggleBtn" onclick="toggleLanguage()"></button>
        <button class="btn-cart" onclick="openCart()">
          <span>🛒</span>
          <span id="cartBtnLabel"></span>
          <span class="cart-badge" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="container hero-inner">
      <div class="hero-pill" id="heroPill"></div>
      <h2 id="heroTitle"></h2>
      <p id="heroDesc"></p>

      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" oninput="renderCatalog()" />
      </div>

      <div class="hero-badges" id="heroBadges"></div>
    </div>
  </section>

  <!-- Filters & Catalog -->
  <main class="container filters-section">
    <span class="filter-label" id="brandFilterLabel"></span>
    <div class="pills-row" id="brandPills"></div>

    <span class="filter-label" id="catFilterLabel"></span>
    <div class="pills-row" id="catPills"></div>

    <div class="catalog-header">
      <div class="results-count" id="resultsCount"></div>
      <button class="clear-btn" id="clearFiltersBtn" onclick="resetFilters()" style="display:none;"></button>
    </div>

    <div class="products-grid" id="productsGrid"></div>
  </main>

  <!-- Branches & Contact Section -->
  <section class="info-section">
    <div class="container">
      <h2 class="section-title" id="branchesSectionTitle"></h2>
      <div class="branches-grid" id="branchesGrid"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="container footer-inner">
      <div id="footerCopy"></div>
      <button class="btn-admin" id="adminOpenBtn" onclick="openAdmin()"></button>
    </div>
  </footer>

  <!-- Cart Drawer (Hidden on load) -->

        branch1Opt: 'Zaid Bin Harithah St. Branch — Al Sinaiyah (RENA3997)',
        branch2Opt: 'Al Sinaiyah 12872 Branch — (JQM4+9G3)',
        notesLabel: 'Additional Notes (Truck model / arrival time)',
        submitOrderBtn: 'Confirm & Send Order via WhatsApp',
        orderSuccessTitle: 'Pick-Up Order Registered!',
        orderIdLabel: 'Order ID:',
        openWaOrderBtn: '💬 Send Order Details on WhatsApp Now',
        adminTitle: 'Rawaea Al-Abraj Admin Panel',
        pinPrompt: 'Enter Admin PIN',
        pinBtn: 'Login'
      }
    };

    let lang = localStorage.getItem('ra_lang') || 'ar';
    let savedSettings = JSON.parse(localStorage.getItem('ra_settings') || 'null');
    let settings = savedSettings ? { ...DEFAULT_SETTINGS, ...savedSettings } : { ...DEFAULT_SETTINGS };
    if (!settings.adminPinHash || settings.adminPin) {
      settings.adminPinHash = DEFAULT_SETTINGS.adminPinHash;
      delete settings.adminPin;
      localStorage.setItem('ra_settings', JSON.stringify(settings));
    }

    let products = JSON.parse(localStorage.getItem('ra_products') || 'null') || [...DEFAULT_PRODUCTS];
    let cart = JSON.parse(localStorage.getItem('ra_cart') || '[]');
    let orders = JSON.parse(localStorage.getItem('ra_orders') || '[]');
    let selectedBrand = 'all';
    let selectedCat = 'all';
    let adminLoggedIn = false;
    let adminTab = 'products';

    function saveState() {
      localStorage.setItem('ra_lang', lang);
      localStorage.setItem('ra_settings', JSON.stringify(settings));
      localStorage.setItem('ra_products', JSON.stringify(products));
      localStorage.setItem('ra_cart', JSON.stringify(cart));
      localStorage.setItem('ra_orders', JSON.stringify(orders));
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { el.style.display = 'none'; }, 2400);
    }

    function buildPriceWaUrl(product) {
      const num = (settings.waPrice || '966581504497').replace(/[^0-9]/g, '');
      const msg = lang === 'ar'
        ? `السلام عليكم، أرغب في معرفة سعر القطعة:\nاسم القطعة: ${product.nameAr}\nرقم القطعة: ${product.oem}`
        : `Hello, I would like to know the price of this part:\nPart Name: ${product.nameEn}\nPart Number (OEM): ${product.oem}`;
      return `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
    }

    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      showToast(TEXT[lang].copiedToast + ': ' + text);
    }

    function toggleLanguage() {
      lang = lang === 'ar' ? 'en' : 'ar';
      saveState();
      applyLanguage();
    }

    function applyLanguage() {
      const t = TEXT[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

      document.getElementById('topBar').innerHTML =
        `${t.topBar} <a href="https://wa.me/${settings.waPrice.replace(/[^0-9]/g,'')}" target="_blank" dir="ltr">+${settings.waPrice.replace(/[^0-9]/g,'')}</a>`;
      document.getElementById('brandTitle').textContent = t.brandTitle;
      document.getElementById('brandSubtitle').textContent = t.brandSubtitle;
      document.getElementById('langToggleBtn').textContent = t.langBtn;
      document.getElementById('cartBtnLabel').textContent = t.cartBtn;
      document.getElementById('heroPill').textContent = t.heroPill;
      document.getElementById('heroTitle').textContent = t.heroTitle;
      document.getElementById('heroDesc').textContent = t.heroDesc;
      document.getElementById('searchInput').placeholder = t.searchPlaceholder;
      document.getElementById('heroBadges').innerHTML = t.badges.map(b => `<span>${b}</span>`).join('');
      document.getElementById('brandFilterLabel').textContent = t.brandFilterLabel;
      document.getElementById('catFilterLabel').textContent = t.catFilterLabel;
      document.getElementById('clearFiltersBtn').textContent = t.clearFilters;
      document.getElementById('branchesSectionTitle').textContent = t.branchesTitle;
      document.getElementById('footerCopy').textContent = t.footerCopy;
      document.getElementById('adminOpenBtn').textContent = t.adminBtn;
      document.getElementById('cartDrawerTitle').textContent = t.cartTitle;
      document.getElementById('cartPriceNote').textContent = t.cartPriceNote;
      document.getElementById('proceedCheckoutBtn').textContent = t.proceedCheckout;

      renderBranches();
      renderFilters();
      renderCatalog();
      updateCartBadge();
    }

    function renderBranches() {
      const t = TEXT[lang];
      const waPriceClean = settings.waPrice.replace(/[^0-9]/g, '');
      const waOrderClean = settings.waOrder.replace(/[^0-9]/g, '');
      document.getElementById('branchesGrid').innerHTML = `
        <div class="info-card">
          <h3>${t.branch1Title}</h3>
          <p>${t.branch1Addr}</p>
          <p><strong>${t.hoursText}</strong></p>
        </div>
        <div class="info-card">
          <h3>${t.branch2Title}</h3>
          <p>${t.branch2Addr}</p>
          <p>${t.landlineLabel} <a class="phone-link" href="tel:${settings.landline.replace(/\s+/g,'')}">${settings.landline}</a></p>
        </div>
        <div class="info-card">
          <h3>${t.hoursTitle}</h3>
          <ul>
            <li>${t.priceWaLabel} <a class="phone-link" href="https://wa.me/${waPriceClean}" target="_blank">+${waPriceClean}</a></li>
            <li>${t.otherContactsLabel}
              <br><a class="phone-link" href="https://wa.me/${waOrderClean}" target="_blank">+${waOrderClean}</a>
              &nbsp;|&nbsp;
              <a class="phone-link" href="tel:${settings.phoneExtra.replace(/\s+/g,'')}">${settings.phoneExtra}</a>
            </li>
          </ul>
        </div>
      `;
    }

    function renderFilters() {
      const t = TEXT[lang];
      document.getElementById('brandPills').innerHTML = Object.entries(t.brands).map(([key, label]) =>
        `<button class="pill ${selectedBrand===key?'active':''}" onclick="setBrand('${key}')">${label}</button>`
      ).join('');

      document.getElementById('catPills').innerHTML = Object.entries(t.cats).map(([key, label]) =>
        `<button class="pill ${selectedCat===key?'active':''}" onclick="setCat('${key}')">${label}</button>`
      ).join('');
    }

    function setBrand(b) { selectedBrand = b; renderFilters(); renderCatalog(); }
    function setCat(c) { selectedCat = c; renderFilters(); renderCatalog(); }
    function resetFilters() {
      selectedBrand = 'all';
      selectedCat = 'all';
      document.getElementById('searchInput').value = '';
      renderFilters();
      renderCatalog();
    }

    function renderCatalog() {
      const t = TEXT[lang];
      const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      const filtered = products.filter(p => {
        if (selectedBrand !== 'all' && p.brand !== selectedBrand) return false;
        if (selectedCat !== 'all' && p.category !== selectedCat) return false;
        if (q) {
          const hay = `${p.nameAr} ${p.nameEn} ${p.oem} ${p.specsAr} ${p.specsEn} ${t.brands[p.brand]||''}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      document.getElementById('resultsCount').textContent = t.resultsCount(filtered.length);
      document.getElementById('clearFiltersBtn').style.display =
        (selectedBrand !== 'all' || selectedCat !== 'all' || q) ? 'inline-block' : 'none';

      const grid = document.getElementById('productsGrid');
      if (!filtered.length) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px 16px;background:#fff;border-radius:14px;border:1px solid #e5e7eb;">
          <p style="font-weight:700;margin-bottom:14px;">${t.noResults}</p>
          <a class="btn-wa" href="https://wa.me/${settings.waPrice.replace(/[^0-9]/g,'')}" target="_blank">${t.waPriceBtn}</a>
        </div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const name = lang === 'ar' ? p.nameAr : p.nameEn;
        const specs = lang === 'ar' ? p.specsAr : p.specsEn;
        const brandLabel = t.brands[p.brand] || p.brand;
        const catLabel = t.cats[p.category] || p.category;
        return `
          <article class="product-card">
            <div>
              <div class="card-top">
                <span class="brand-tag">${brandLabel}</span>
                <span class="cat-tag">${catLabel}</span>
              </div>
              <div class="part-visual" onclick="openQuickView(${p.id})">
                <span class="part-icon">${p.icon || '⚙️'}</span>
                <span class="oem-pill">OEM: ${p.oem}</span>
              </div>
              <h3 class="product-title" onclick="openQuickView(${p.id})">${name}</h3>
              <p class="product-specs">${specs}</p>
            </div>
            <div class="card-actions">
              <a class="btn-wa" href="${buildPriceWaUrl(p)}" target="_blank">${t.waPriceBtn}</a>
              <div class="card-sub-actions">
                <button class="btn-add" onclick="addToCart(${p.id})">${t.addToCartBtn}</button>
                <button class="btn-copy" onclick="copyText('${p.oem.replace(/'/g,"\\'")}')">${t.copyOemBtn}</button>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function openQuickView(id) {
      const p = products.find(x => x.id === id);
      if (!p) return;
      const t = TEXT[lang];
      const name = lang === 'ar' ? p.nameAr : p.nameEn;
      const specs = lang === 'ar' ? p.specsAr : p.specsEn;
      document.getElementById('qvTitle').textContent = name;
      document.getElementById('qvBody').innerHTML = `
        <div class="part-visual" style="margin-bottom:16px;">
          <span class="part-icon" style="font-size:3rem;">${p.icon || '⚙️'}</span>
          <div style="margin-top:8px;"><strong>${t.qvOem}</strong> <span class="oem-pill">${p.oem}</span></div>
        </div>
        <p style="margin-bottom:16px;"><strong>${t.qvSpecs}</strong> ${specs}</p>
        <div class="price-note">${t.cartPriceNote}</div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <a class="btn-wa" href="${buildPriceWaUrl(p)}" target="_blank">${t.waPriceBtn}</a>
          <button class="btn-primary" onclick="addToCart(${p.id}); closeQuickView();">${t.addToCartBtn}</button>
        </div>
      `;
      document.getElementById('quickViewOverlay').style.display = 'flex';
    }
    function closeQuickView() { document.getElementById('quickViewOverlay').style.display = 'none'; }

    function addToCart(id) {
      const existing = cart.find(i => i.id === id);
      if (existing) existing.qty += 1;
      else cart.push({ id, qty: 1 });
      saveState();
      updateCartBadge();
      showToast(TEXT[lang].addedToast);
    }

    function updateQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
      saveState();
      updateCartBadge();
      renderCartItems();
    }

    function updateCartBadge() {
      const total = cart.reduce((s, i) => s + i.qty, 0);
      document.getElementById('cartCount').textContent = total;
    }

    function openCart() {
      renderCartItems();
      document.getElementById('cartOverlay').style.display = 'flex';
    }
    function closeCart() { document.getElementById('cartOverlay').style.display = 'none'; }

    function renderCartItems() {
      const t = TEXT[lang];
      const box = document.getElementById('cartItemsContainer');
      const btn = document.getElementById('proceedCheckoutBtn');
      if (!cart.length) {
        box.innerHTML = `<p style="text-align:center;color:#6b7280;padding:40px 10px;font-weight:700;">${t.cartEmpty}</p>`;
        btn.disabled = true;
        btn.style.opacity = '0.5';
        return;
      }
      btn.disabled = false;
      btn.style.opacity = '1';
      box.innerHTML = cart.map(item => {
        const p = products.find(x => x.id === item.id);
        if (!p) return '';
        const name = lang === 'ar' ? p.nameAr : p.nameEn;
        return `
          <div class="cart-item">
            <div>
              <div style="font-weight:800;font-size:0.92rem;">${name}</div>
              <div style="font-size:0.8rem;color:#6b7280;direction:ltr;display:inline-block;">OEM: ${p.oem}</div>
            </div>
            <div class="qty-controls">
              <button onclick="updateQty(${p.id}, -1)">−</button>
              <strong>${item.qty}</strong>
              <button onclick="updateQty(${p.id}, 1)">+</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openCheckout() {
      if (!cart.length) return;
      closeCart();
      const t = TEXT[lang];
      document.getElementById('checkoutTitle').textContent = t.checkoutTitle;
      document.getElementById('checkoutBody').innerHTML = `
        <form id="checkoutForm" onsubmit="submitOrder(event)">
          <div class="form-group">
            <label>${t.nameLabel}</label>
            <input type="text" id="custName" required />
          </div>
          <div class="form-group">
            <label>${t.phoneLabel}</label>
            <input type="tel" id="custPhone" required placeholder="05xxxxxxxx" dir="ltr" />
          </div>
          <div class="form-group">
            <label>${t.branchLabel}</label>
            <select id="custBranch" required>
              <option value="${t.branch1Opt}">${t.branch1Opt}</option>
              <option value="${t.branch2Opt}">${t.branch2Opt}</option>
            </select>
          </div>
          <div class="form-group">
            <label>${t.notesLabel}</label>
            <textarea id="custNotes" rows="2"></textarea>
          </div>
          <div class="price-note">${t.cartPriceNote}</div>
          <button type="submit" class="btn-primary">${t.submitOrderBtn}</button>
        </form>
      `;
      document.getElementById('checkoutOverlay').style.display = 'flex';
    }
    function closeCheckout() { document.getElementById('checkoutOverlay').style.display = 'none'; }

    async function submitOrder(e) {
      e.preventDefault();
      const t = TEXT[lang];
      const orderId = 'RA-' + Math.floor(1000 + Math.random() * 9000);
      const customerName = document.getElementById('custName').value.trim();
      const customerPhone = document.getElementById('custPhone').value.trim();
      const branch = document.getElementById('custBranch').value;
      const notes = document.getElementById('custNotes').value.trim();
      const itemsList = cart.map(i => {
        const p = products.find(x => x.id === i.id);
        return p ? `${lang==='ar'?p.nameAr:p.nameEn} (OEM: ${p.oem}) × ${i.qty}` : '';
      }).filter(Boolean);

      const orderRecord = {
        orderId,
        date: new Date().toLocaleString('en-GB'),
        customerName,
        customerPhone,
        branch,
        items: itemsList.join(' | '),
        totalQty: cart.reduce((s, i) => s + i.qty, 0),
        notes,
        status: 'New Pick-Up'
      };

      orders.unshift(orderRecord);
      cart = [];
      saveState();
      updateCartBadge();

      if (settings.webhookUrl) {
        try {
          await fetch(settings.webhookUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(orderRecord)
          });
        } catch (err) { console.warn('Webhook sync skipped:', err); }
      }

      const waOrderNum = (settings.waOrder || '966504258930').replace(/[^0-9]/g, '');
      const waMsg = lang === 'ar'
        ? `طلب استلام من الفرع (الرياض)\nرقم الطلب: ${orderId}\nالاسم: ${customerName}\nالجوال: ${customerPhone}\nالفرع: ${branch}\nالقطع المطلوبة:\n- ${itemsList.join('\n- ')}\nالسعر: يتم تأكيده عبر الواتساب${notes ? '\nملاحظات: ' + notes : ''}`
        : `Branch Pick-Up Order (Riyadh)\nOrder ID: ${orderId}\nName: ${customerName}\nPhone: ${customerPhone}\nBranch: ${branch}\nItems:\n- ${itemsList.join('\n- ')}\nPrice: Confirmed via WhatsApp${notes ? '\nNotes: ' + notes : ''}`;

      const waUrl = `https://wa.me/${waOrderNum}?text=${encodeURIComponent(waMsg)}`;
      document.getElementById('checkoutBody').innerHTML = `
        <div style="text-align:center;padding:16px 6px;">
          <div style="font-size:2.6rem;margin-bottom:8px;">✅</div>
          <h3 style="margin-bottom:8px;color:#15803d;">${t.orderSuccessTitle}</h3>
          <p style="font-weight:800;margin-bottom:16px;">${t.orderIdLabel} <span dir="ltr">${orderId}</span></p>
          <a class="btn-wa" style="width:100%;padding:13px;" href="${waUrl}" target="_blank">${t.openWaOrderBtn}</a>
        </div>
      `;
    }

                <div><strong>${p.nameAr}</strong> <span style="color:#6b7280;font-size:0.82rem;" dir="ltr">(${p.oem})</span></div>

      } else if (adminTab === 'orders') {

            <div class="form-group"><label>رقم واتساب استلام الطلبات (مع رمز الدولة بدون +)</label><input id="setWaOrder" dir="ltr" value="${settings.waOrder}" /></div>
            <div class="form-group"><label>رقم جوال إضافي</label><input id="setPhoneExtra" dir="ltr" value="${settings.phoneExtra}" /></div>
            <div class="form-group"><label>الهاتف الثابت</label><input id="setLandline" dir="ltr" value="${settings.landline}" /></div>
            <div class="form-group"><label>تغيير رمز PIN لوحة التحكم (اختياري)</label><input type="password" id="setPin" dir="ltr" placeholder="اتركه فارغاً للإبقاء على الرمز الحالي" autocomplete="new-password" /></div>
            <button type="submit" class="btn-primary">حفظ الإعدادات</button>
          </form>
        `;
      }
    }

    function checkAdminPin(e) {
      e.preventDefault();
      const entered = document.getElementById('pinInput').value.trim();
      if (hashPin(entered) === settings.adminPinHash) {
        adminLoggedIn = true;
        renderAdmin();
      } else {
        showToast('رمز PIN غير صحيح');
      }
    }

    function addProductAdmin(e) {
      e.preventDefault();
      const newId = products.length ? Math.max(...products.map(p => p.id)) + 1 : 1;
      const specs = document.getElementById('npSpecsAr').value.trim() || 'قطعة غيار أصلية للخدمة الشاقة';
      products.unshift({
        id: newId,
        nameAr: document.getElementById('npNameAr').value.trim(),
        nameEn: document.getElementById('npNameEn').value.trim(),
        oem: document.getElementById('npOem').value.trim(),
        brand: document.getElementById('npBrand').value,
        category: document.getElementById('npCat').value,
        icon: '⚙️',
        specsAr: specs,
        specsEn: specs
      });
      saveState();
      renderCatalog();
      renderAdmin();
      showToast('تمت إضافة القطعة');
    }

    function deleteProductAdmin(id) {
      products = products.filter(p => p.id !== id);
      saveState();
      renderCatalog();
      renderAdmin();
    }

    function resetProductsDefault() {
      products = [...DEFAULT_PRODUCTS];
      saveState();
      renderCatalog();
      renderAdmin();
      showToast('تمت استعادة المنتجات الافتراضية');
    }

    function saveWebhook() {
      settings.webhookUrl = document.getElementById('webhookInput').value.trim();
      saveState();
      showToast('تم حفظ رابط Google Sheets');
    }

    function saveSettingsAdmin(e) {
      e.preventDefault();
      settings.waPrice = document.getElementById('setWaPrice').value.trim();
      settings.waOrder = document.getElementById('setWaOrder').value.trim();
      settings.phoneExtra = document.getElementById('setPhoneExtra').value.trim();
      settings.landline = document.getElementById('setLandline').value.trim();
      const newPin = document.getElementById('setPin').value.trim();
      if (newPin) {
        settings.adminPinHash = hashPin(newPin);
      }
      saveState();
      applyLanguage();
      showToast('تم حفظ الإعدادات بنجاح');
    }

    function exportOrdersCsv() {
      const header = ['Order ID','Date','Customer','Phone','Branch','Items','Qty','Notes','Status'];
      const rows = orders.map(o => [o.orderId, o.date, o.customerName, o.customerPhone, o.branch, o.items, o.totalQty, o.notes, o.status]
        .map(v => `"${String(v||'').replace(/"/g,'""')}"`).join(','));
      const csv = '\uFEFF' + [header.join(','), ...rows].join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'rawaea-alabraj-orders.csv';
      a.click();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeCart(); closeQuickView(); closeCheckout(); closeAdmin();
      }
    });

    applyLanguage();
  </script>
</body>
</html>
